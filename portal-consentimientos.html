<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Consentimientos - CInformado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #F8F7F2; color: #4A4A4A; }
        h1 { font-family: 'Poppins', sans-serif; color: #1a1a1a; font-weight: 700; }
        .card { background-color: white; border-radius: 16px; padding: 2rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .consent-item { 
            transition: background-color 0.2s ease-in-out, opacity 0.5s ease;
            border-bottom: 1px solid #e5e7eb;
        }
        .consent-item:hover { background-color: #fafafa; }
        .consent-item:last-child { border-bottom: none; }
    </style>
</head>
<body class="bg-gray-50">
    <header class="bg-white shadow-sm">
        <div class="container mx-auto px-6 py-4 flex flex-wrap justify-between items-center gap-4">
            <a href="index.html" class="flex-shrink-0">
                <img src="logoprincipal.png" alt="Caminos del Ser Logo" class="h-11 w-auto">
            </a>
            
            <!-- NUEVO MENÚ DE NAVEGACIÓN CENTRAL -->
            <nav class="flex-grow flex justify-center space-x-2 md:space-x-6 items-center">
                <!-- Se deja preparado el botón de Agenda y Pagos como mencionó la estrategia -->
                <a href="#" class="text-sm font-medium text-gray-500 hover:text-[#003366] transition-colors">
                    Agenda y Pagos
                </a>
                
                <!-- NUEVO BOTÓN: Aprobación de Reseñas -->
                <a href="panel-resenas.html" class="text-sm font-medium text-[#003366] bg-blue-50 border border-blue-100 px-4 py-2 rounded-full hover:bg-[#003366] hover:text-white transition-all shadow-sm flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
                    </svg>
                    Aprobar Reseñas
                </a>
            </nav>

            <button id="logoutButton" class="text-sm font-medium text-gray-500 hover:text-red-600 transition-colors flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Salir
            </button>
        </div>
    </header>

    <main class="container mx-auto px-6 py-12">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-bold">Portal de Consentimientos</h1>
            </div>

            <div class="card">
                <div id="loading" class="text-center py-10">
                    <p class="text-lg">Cargando consentimientos...</p>
                </div>
                <div id="consentList" class="hidden">
                    </div>
                 <div id="noConsents" class="hidden text-center py-10">
                    <p class="text-lg text-gray-500">Aún no se han recibido consentimientos firmados.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const isAuthenticated = sessionStorage.getItem('consultorAuth');
            if (isAuthenticated !== 'true') {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('logoutButton').addEventListener('click', () => {
                sessionStorage.removeItem('consultorAuth');
                window.location.href = 'login.html';
            });

            fetchConsentimientos();
        });

        async function fetchConsentimientos() {
            const loadingDiv = document.getElementById('loading');
            const consentListDiv = document.getElementById('consentList');
            const noConsentsDiv = document.getElementById('noConsents');

            try {
                const response = await fetch('/api/get-consentimientos');
                if (!response.ok) {
                    throw new Error('Error al conectar con el servidor.');
                }
                const consentimientos = await response.json();

                loadingDiv.classList.add('hidden');

                if (consentimientos.length === 0) {
                    noConsentsDiv.classList.remove('hidden');
                } else {
                    let html = '<div class="divide-y divide-gray-200">';
                    consentimientos.forEach(consent => {
                        const fecha = new Date(consent.fecha).toLocaleString('es-CO', { 
                            day: '2-digit', month: 'long', year: 'numeric',
                            hour: '2-digit', minute: '2-digit'
                        });
                        // --- CAMBIO: Se añade un div contenedor con flex y el botón de eliminar ---
                        html += `
                            <div class="consent-item p-4 flex justify-between items-center" id="consent-item-${consent.id}">
                                <a href="detalle-consentimiento.html?id=${consent.id}" class="flex-grow">
                                    <div>
                                        <p class="font-bold text-lg text-[#003366]">${consent.nombre}</p>
                                        <p class="text-sm text-gray-600">Email: ${consent.email}</p>
                                        <p class="text-xs text-gray-400 mt-1">Firmado el: ${fecha}</p>
                                    </div>
                                </a>
                                <button onclick="deleteConsent('${consent.id}')" class="ml-4 p-2 rounded-full hover:bg-red-100 transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                    </svg>
                                </button>
                            </div>
                        `;
                    });
                    html += '</div>';
                    
                    consentListDiv.innerHTML = html;
                    consentListDiv.classList.remove('hidden');
                }

            } catch (error) {
                console.error(error);
                loadingDiv.textContent = 'Error al cargar los consentimientos.';
            }
        }

        // --- NUEVA FUNCIÓN PARA ELIMINAR ---
        async function deleteConsent(id) {
            // 1. Pedir confirmación al usuario
            if (!confirm('¿Estás seguro de que deseas eliminar este consentimiento de forma permanente? Esta acción no se puede deshacer.')) {
                return;
            }

            try {
                // 2. Llamar al nuevo endpoint del servidor
                const response = await fetch(`/api/eliminar-consentimiento?id=${id}`, {
                    method: 'DELETE',
                });

                if (response.ok) {
                    // 3. Si tiene éxito, eliminar el elemento de la vista
                    const consentItem = document.getElementById(`consent-item-${id}`);
                    if (consentItem) {
                        consentItem.style.opacity = '0';
                        setTimeout(() => consentItem.remove(), 500); // Eliminar después de la animación
                    }
                } else {
                    const errorData = await response.json();
                    alert(`Error al eliminar el consentimiento: ${errorData.message}`);
                }
            } catch (error) {
                console.error('Error de red al eliminar:', error);
                alert('Hubo un error de conexión al intentar eliminar el consentimiento.');
            }
        }
    </script>
</body>
</html>
